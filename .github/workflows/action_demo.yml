name: hello-world
on: workflow_dispatch
jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
      - name: my-step
        run: echo "Hello World!"
      - name: run-commands
        run: |
          echo "Python Version"
          python --version
          echo "Who AM I"
          whoami
          echo "List directories"
          ls -la
          echo "Present working directories"
          pwd
        
        
        
